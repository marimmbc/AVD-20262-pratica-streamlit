# Identidade visual do app (Aula 22).
# Paleta derivada das cores da EDA: roxo escuro = classe de interesse (doença cardíaca),
# rosa claro = referência. O destaque é um vinho, que remete a coração/saúde cardiovascular.
# O tema claro/escuro pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.0rem"     # espaço abaixo da barra do topo (valor entre aspas)
font = "'Nunito Sans':https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
headingFont = "Lora:https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap"
baseRadius = "0.6rem"

[theme.light]
primaryColor = "#8e3b5f"              # cor de destaque (widgets, sliders, abas ativas): vinho
backgroundColor = "#fcf9f8"           # fundo da página: off-white quente
secondaryBackgroundColor = "#f3e7e4"  # fundo da sidebar e de widgets: rosa bem claro
textColor = "#2d223a"                 # texto: mesmo roxo escuro dos gráficos
borderColor = "#e3d2ce"

[theme.dark]
primaryColor = "#d98aa9"
backgroundColor = "#17121d"
secondaryBackgroundColor = "#2d223a"
textColor = "#f3e7e4"
borderColor = "#453852"
